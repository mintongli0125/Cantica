<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantica - John 1:1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 40px;
      max-width: 900px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
      font-size: 14px;
    }

    .interlinear {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .column-title {
      font-weight: 600;
      color: #667eea;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      line-height: 1.8;
    }

    .greek-word {
      font-size: 20px;
      font-weight: 500;
      color: #333;
      cursor: default;
      position: relative;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .greek-word:hover {
      background: #f0f0f0;
    }

    /* Inputs should size to their content; highlights will now match the word length */
    .english-word {
      font-size: 18px;
      padding: 1px 1px;
      border: 1px solid transparent;
      border-radius: 1px;
      color: #333;
      cursor: text;
      transition: all 0.2s ease;
      font-weight: 500;
      /* Prevent stretching to fill space; they will get widths set in JS */
      flex: 0 0 auto;
      min-width: 1ch;
      width: auto;
      box-sizing: content-box;
    }

    .english-word:hover {
      border-color: #667eea;
      background: #e8ebff;
    }

    .english-word:focus {
      outline: none;
      border-color: #667eea;
      background: #e8ebff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .greek-word.highlighted {
      background: #fff4e6;
      color: #ff8c00;
    }

    .english-word.highlighted {
      background: #fff4e6;
      border-color: #ff8c00;
      color: #ff8c00;
    }

    .strong-ref {
      font-size: 11px;
      color: #999;
      position: absolute;
      top: -8px;
      right: 2px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .btn-reset {
      background: #ff6b6b;
      color: white;
    }

    .btn-reset:hover {
      background: #ee5a52;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }

    .btn-export {
      background: #667eea;
      color: white;
    }

    .btn-export:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .interlinear {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .english-word,
      .greek-word {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cantica</h1>
    <p class="subtitle">John 1:1 - Interlinear Study</p>

    <div class="interlinear">
      <div class="column">
        <div class="column-title">Greek</div>
        <div id="greek-col"></div>
      </div>
      <div class="column">
        <div class="column-title">English</div>
        <div id="english-col"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-export" onclick="exportEdits()">Export Edits</button>
      <button class="btn-reset" onclick="resetAll()">Reset to Default</button>
    </div>

    <div class="status">
      <span id="status-text">Ready</span>
    </div>
  </div>

  <script>
    let data = [];
    let englishWordsFlat = [];
    
    async function loadData() {
      try {
        const response = await fetch(
          'https://raw.githubusercontent.com/mintongli0125/InterlinearBible/main/john-1-1.json'
        );
        const json = await response.json();
        data = json.words;
        englishWordsFlat = json.englishWordsFlat;
        await renderInterlinear();
      } catch (error) {
        console.error('Failed to load data:', error);
        document.getElementById('status-text').textContent = 'Error loading data';
      }
    }

    // IndexedDB setup
    let db;
    const dbName = "CanticalDB";
    const storeName = "edits";

    async function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);

        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };

        request.onupgradeneeded = (event) => {
          const objectStore = event.target.result.createObjectStore(storeName, {
            keyPath: "id"
          });
          objectStore.createIndex("wordIndex", "wordIndex", { unique: true });
        };
      });
    }

    async function getEditedText(wordIndex) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readonly");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.get(wordIndex);

        request.onsuccess = () => {
          resolve(request.result?.text || null);
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function saveEdit(wordIndex, text) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readwrite");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.put({
          id: wordIndex,
          wordIndex: wordIndex,
          text: text,
          timestamp: Date.now()
        });

        request.onsuccess = () => {
          resolve();
          updateStatus("Saved ✓");
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function getAllEdits() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readonly");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.getAll();

        request.onsuccess = () => {
          resolve(request.result);
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteEdit(wordIndex) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readwrite");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.delete(wordIndex);

        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function clearAllEdits() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readwrite");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.clear();

        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function updateStatus(message) {
      const statusEl = document.getElementById("status-text");
      statusEl.textContent = message;
      setTimeout(() => {
        statusEl.textContent = "Ready";
      }, 2000);
    }

    function highlightGroup(alignmentIndices) {
      // Highlight all Greek and English words in this alignment group
      data.forEach((greekWord) => {
        const greekEl = document.querySelector(
          `.greek-col-word[data-greek-id="${greekWord.id}"]`
        );
        if (alignmentIndices.some(idx => greekWord.alignment.includes(idx))) {
          greekEl?.classList.add("highlighted");
        } else {
          greekEl?.classList.remove("highlighted");
        }
      });

      alignmentIndices.forEach((idx) => {
        const englishEl = document.querySelector(
          `.english-col-word[data-english-index="${idx}"]`
        );
        englishEl?.classList.add("highlighted");
      });
    }

    function unhighlightAll() {
      document.querySelectorAll(".greek-word.highlighted, .english-word.highlighted")
        .forEach((el) => el.classList.remove("highlighted"));
    }

    // Set input width based on its current value length (uses 'ch' unit)
    function setInputWidth(input) {
      try {
        // Ensure at least 2 characters visible and add 1ch padding for caret/comfort
        const len = Math.max(2, input.value?.length || 0);
        input.style.width = `${len}ch`;
      } catch (err) {
        // fallback - do nothing
      }
    }

    async function renderInterlinear() {
      const greekCol = document.getElementById("greek-col");
      const englishCol = document.getElementById("english-col");

      greekCol.innerHTML = "";
      englishCol.innerHTML = "";

      // Render Greek column - all in one line
      const greekLine = document.createElement("div");
      greekLine.className = "line";

      data.forEach((item) => {
        const greekWord = document.createElement("span");
        greekWord.className = "greek-word greek-col-word";
        greekWord.dataset.greekId = item.id;
        greekWord.textContent = item.greek;

        const strongRef = document.createElement("span");
        strongRef.className = "strong-ref";
        strongRef.textContent = `${item.strongs}`;
        greekWord.appendChild(strongRef);

        greekWord.addEventListener("mouseenter", () =>
          highlightGroup(item.alignment)
        );
        greekWord.addEventListener("mouseleave", unhighlightAll);

        greekLine.appendChild(greekWord);
      });
      greekCol.appendChild(greekLine);

      // Render English column - all in one line
      const englishLine = document.createElement("div");
      englishLine.className = "line";

      for (let i = 0; i < englishWordsFlat.length; i++) {
        const englishInput = document.createElement("input");
        englishInput.type = "text";
        englishInput.className = "english-word english-col-word";
        englishInput.dataset.englishIndex = i;

        // Load from IndexedDB
        const editedText = await getEditedText(i);
        englishInput.value = editedText || englishWordsFlat[i];

        // Size the input to fit the word length
        setInputWidth(englishInput);

        // Find which Greek word(s) map to this English word
        const mappedGreekAlignment = data
          .filter(gw => gw.alignment.includes(i))
          .flatMap(gw => gw.alignment);

        englishInput.addEventListener("mouseenter", () =>
          highlightGroup([i, ...mappedGreekAlignment])
        );
        englishInput.addEventListener("mouseleave", unhighlightAll);
        englishInput.addEventListener("focus", () =>
          highlightGroup([i, ...mappedGreekAlignment])
        );
        englishInput.addEventListener("blur", unhighlightAll);

        englishInput.addEventListener("input", async (e) => {
          // Resize as user types so highlight matches current text length
          setInputWidth(e.target);
          await saveEdit(i, e.target.value);
        });

        englishLine.appendChild(englishInput);
      }
      englishCol.appendChild(englishLine);
    }

    async function exportEdits() {
      const edits = await getAllEdits();
      
      const greekText = data.map(w => w.greek).join(" ");
      
      const exportData = {
        verse: "John 1:1",
        greekText: greekText,
        exportedAt: new Date().toISOString(),
        edits: edits.map((e) => ({
          wordIndex: e.wordIndex,
          originalText: englishWordsFlat[e.wordIndex],
          editedText: e.text
        }))
      };
    
      const blob = new Blob([JSON.stringify(exportData, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cantica-edits-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    
      updateStatus("Exported ✓");
    }

    async function resetAll() {
      if (confirm("Reset all edits to defaults? This cannot be undone.")) {
        await clearAllEdits();
        await renderInterlinear();
        updateStatus("Reset ✓");
      }
    }

    // Init
    (async () => {
      await initDB();
      await loadData();
    })();
  </script>
</body>
</html>
