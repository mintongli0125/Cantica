<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantica - John 1:1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 900px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
      font-size: 14px;
    }

    .interlinear {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .column-title {
      font-weight: 600;
      color: #667eea;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .word-pair {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .greek-word {
      font-size: 20px;
      font-weight: 500;
      color: #333;
      min-width: 60px;
    }

    .english-word {
      flex: 1;
      font-size: 18px;
      padding: 8px 12px;
      border: 2px solid transparent;
      border-radius: 6px;
      background: #f8f9fa;
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .english-word:hover {
      border-color: #667eea;
      background: #e8ebff;
    }

    .english-word:focus {
      outline: none;
      border-color: #667eea;
      background: #e8ebff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .english-word.editing {
      background: #fff4e6;
      border-color: #ffa500;
    }

    .word-pair.highlighted .greek-word {
      background: #fff4e6;
      border-radius: 4px;
      padding: 4px 8px;
      color: #ff8c00;
      font-weight: 600;
    }

    .word-pair.highlighted .english-word {
      background: #fff4e6;
      border-color: #ff8c00;
      color: #ff8c00;
    }

    .strong-ref {
      font-size: 12px;
      color: #999;
      margin-left: 4px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .btn-reset {
      background: #ff6b6b;
      color: white;
    }

    .btn-reset:hover {
      background: #ee5a52;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }

    .btn-export {
      background: #667eea;
      color: white;
    }

    .btn-export:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .interlinear {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .english-word,
      .greek-word {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cantica</h1>
    <p class="subtitle">John 1:1 - Interlinear Study</p>

    <div class="interlinear">
      <div class="column">
        <div class="column-title">Greek</div>
        <div id="greek-col"></div>
      </div>
      <div class="column">
        <div class="column-title">English</div>
        <div id="english-col"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-export" onclick="exportEdits()">Export Edits</button>
      <button class="btn-reset" onclick="resetAll()">Reset to Default</button>
    </div>

    <div class="status">
      <span id="status-text">Ready</span>
    </div>
  </div>

  <script>
    // Data: Greek words mapped to English with Strong's numbers
    let data = [];
    let englishWordsFlat = [];
    
    async function loadData() {
      try {
        const response = await fetch(
          'https://raw.githubusercontent.com/mintongli0125/InterlinearBible/main/john-1-1.json'
        );
        const json = await response.json();
        data = json.words;
        englishWordsFlat = json.englishWordsFlat;
        await renderInterlinear();
      } catch (error) {
        console.error('Failed to load data:', error);
        document.getElementById('status-text').textContent = 'Error loading data';
      }
    }
    const englishWordsFlat = ["In", "the", "beginning"];

    // IndexedDB setup
    let db;
    const dbName = "CanticalDB";
    const storeName = "edits";

    async function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);

        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };

        request.onupgradeneeded = (event) => {
          const objectStore = event.target.result.createObjectStore(storeName, {
            keyPath: "id"
          });
          objectStore.createIndex("wordIndex", "wordIndex", { unique: true });
        };
      });
    }

    async function getEditedText(wordIndex) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readonly");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.get(wordIndex);

        request.onsuccess = () => {
          resolve(request.result?.text || null);
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function saveEdit(wordIndex, text) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readwrite");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.put({
          id: wordIndex,
          wordIndex: wordIndex,
          text: text,
          timestamp: Date.now()
        });

        request.onsuccess = () => {
          resolve();
          updateStatus("Saved ✓");
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function getAllEdits() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readonly");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.getAll();

        request.onsuccess = () => {
          resolve(request.result);
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteEdit(wordIndex) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readwrite");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.delete(wordIndex);

        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function clearAllEdits() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], "readwrite");
        const objectStore = transaction.objectStore(storeName);
        const request = objectStore.clear();

        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function updateStatus(message) {
      const statusEl = document.getElementById("status-text");
      statusEl.textContent = message;
      setTimeout(() => {
        statusEl.textContent = "Ready";
      }, 2000);
    }

    function highlightWordPair(englishIndex) {
      // Find which Greek word(s) contain this English word
      data.forEach((greekWord) => {
        const isHighlighted = greekWord.alignment.includes(englishIndex);
        const greekEl = document.querySelector(
          `.greek-col-word[data-greek-id="${greekWord.id}"]`
        );
        const englishEl = document.querySelector(
          `.english-col-word[data-english-index="${englishIndex}"]`
        );

        if (isHighlighted) {
          greekEl?.parentElement.classList.add("highlighted");
          englishEl?.parentElement.classList.add("highlighted");
        } else {
          greekEl?.parentElement.classList.remove("highlighted");
          englishEl?.parentElement.classList.remove("highlighted");
        }
      });
    }

    function unhighlightAll() {
      document
        .querySelectorAll(".word-pair.highlighted")
        .forEach((el) => el.classList.remove("highlighted"));
    }

    async function renderInterlinear() {
      const greekCol = document.getElementById("greek-col");
      const englishCol = document.getElementById("english-col");

      greekCol.innerHTML = "";
      englishCol.innerHTML = "";

      // Render Greek column
      data.forEach((item) => {
        const wordPair = document.createElement("div");
        wordPair.className = "word-pair";

        const greekWord = document.createElement("span");
        greekWord.className = "greek-word greek-col-word";
        greekWord.dataset.greekId = item.id;
        greekWord.textContent = item.greek;

        const strongRef = document.createElement("span");
        strongRef.className = "strong-ref";
        strongRef.textContent = `(${item.strongs})`;

        greekWord.appendChild(strongRef);

        greekWord.addEventListener("mouseenter", () =>
          highlightWordPair(item.alignment[0])
        );
        greekWord.addEventListener("mouseleave", unhighlightAll);

        wordPair.appendChild(greekWord);
        greekCol.appendChild(wordPair);
      });

      // Render English column
      for (let i = 0; i < englishWordsFlat.length; i++) {
        const wordPair = document.createElement("div");
        wordPair.className = "word-pair";

        const englishInput = document.createElement("input");
        englishInput.type = "text";
        englishInput.className = "english-word english-col-word";
        englishInput.dataset.englishIndex = i;

        // Load from IndexedDB
        const editedText = await getEditedText(i);
        englishInput.value = editedText || englishWordsFlat[i];

        englishInput.addEventListener("mouseenter", () => highlightWordPair(i));
        englishInput.addEventListener("mouseleave", unhighlightAll);
        englishInput.addEventListener("focus", () => highlightWordPair(i));
        englishInput.addEventListener("blur", unhighlightAll);

        englishInput.addEventListener("input", async (e) => {
          await saveEdit(i, e.target.value);
        });

        wordPair.appendChild(englishInput);
        englishCol.appendChild(wordPair);
      }
    }

    async function exportEdits() {
      const edits = await getAllEdits();
      
      // Build Greek text from data
      const greekText = data.map(w => w.greek).join(" ");
      
      const exportData = {
        verse: "John 1:1",  // You can hardcode or pass this in the JSON too
        greekText: greekText,
        exportedAt: new Date().toISOString(),
        edits: edits.map((e) => ({
          wordIndex: e.wordIndex,
          originalText: englishWordsFlat[e.wordIndex],
          editedText: e.text
        }))
      };
    
      const blob = new Blob([JSON.stringify(exportData, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cantica-edits-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    
      updateStatus("Exported ✓");
    }

    async function resetAll() {
      if (confirm("Reset all edits to defaults? This cannot be undone.")) {
        await clearAllEdits();
        await renderInterlinear();
        updateStatus("Reset ✓");
      }
    }

    // Init
    (async () => {
      await initDB();
      await loadData();
      await renderInterlinear();
    })();
  </script>
</body>
</html>
